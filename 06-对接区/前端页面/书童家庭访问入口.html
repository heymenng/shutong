<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="entryTitle">伴读书童 · 家庭访问入口</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: '隶变-简', 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #e8dfd1 0%, #f0e6d6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #3d3229;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #fffdf7;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(61, 50, 41, 0.15);
            padding: 36px 28px;
            text-align: center;
        }
        .avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 18px;
            background: #c4a77d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 4px 16px rgba(61, 50, 41, 0.12);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        .subtitle {
            color: #7a6e5f;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .link-btn {
            display: block;
            padding: 16px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .link-btn.parent {
            background: #b54a3f;
            color: white;
            box-shadow: 0 4px 12px rgba(181, 74, 63, 0.25);
        }
        .link-btn.parent:hover { background: #9d3f35; transform: translateY(-1px); }
        .link-btn.child {
            background: #7a9e7e;
            color: white;
        }
        .link-btn.child:hover { background: #6a8a6e; }
        .link-btn.master {
            background: #7a6fa3;
            color: white;
        }
        .link-btn.master:hover { background: #6a5f8f; }
        .link-btn.mobile {
            background: #4a90a4;
            color: white;
        }
        .link-btn.mobile:hover { background: #3b7a8c; }
        .link-btn.motong {
            background: #c98c4e;
            color: white;
        }
        .link-btn.motong:hover { background: #b57d45; }
        .divider {
            height: 1px;
            background: #e0d5c5;
            margin: 24px 0;
        }
        .tip {
            font-size: 13px;
            color: #8a7f70;
            line-height: 1.6;
        }
        .ip-box {
            background: #f5f0e8;
            border-radius: 10px;
            padding: 12px;
            margin-top: 16px;
            font-size: 13px;
            color: #5a5045;
            word-break: break-all;
        }
        .lang-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            background: #fffdf7;
            border: 1px solid #d9cfc0;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 13px;
            cursor: pointer;
            color: #7a6e5f;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(61, 50, 41, 0.08);
            z-index: 100;
        }
        .lang-toggle:hover { background: #f7f3e9; border-color: #c4a77d; }
        @media (max-width: 420px) {
            .container { padding: 28px 20px; }
            h1 { font-size: 20px; }
            .link-btn { font-size: 15px; padding: 14px 16px; }
        }
    </style>
    <script src="/static/i18n.js"></script>
</head>
<body>
    <button class="lang-toggle" data-i18n-toggle onclick="bookboyI18n.toggleLanguage()" title="切换语言">中/EN</button>
    <div class="container">
        <div class="avatar"><span class="default-avatar">📖</span></div>
        <h1 data-i18n="brandName">伴读书童</h1>
        <div class="subtitle" data-i18n="entrySubtitle">家庭访问入口 · 点击即可进入对应版本</div>

        <div class="links">
            <a id="link-parent" class="link-btn parent" href="#" data-i18n="parentPortal">🏠 家长端</a>
            <a id="link-child" class="link-btn child" href="#" data-i18n="childPortal">👶 孩子端</a>
            <a id="link-mobile" class="link-btn mobile" href="#" data-i18n="mobilePortal">📱 手机端</a>
            <a id="link-motong" class="link-btn motong" href="#" data-i18n="motongPortal">✍️ 墨童（家长助手）</a>
            <a id="link-master" class="link-btn master" href="#" data-i18n="masterPortal">🎓 师父控制台</a>
        </div>

        <div class="divider"></div>

        <div class="tip" data-i18n-html="entryTip">
            请确保书童服务已启动。<br>
            同一 WiFi/局域网内的电脑、手机、平板都可以访问上面的链接。
        </div>

        <div class="ip-box" id="ip-box">
            <span data-i18n="currentAddress">当前访问地址：</span><span id="current-url">-</span>
        </div>
    </div>

    <script>
        // 自动根据当前访问地址生成各版本链接
        const host = location.hostname;
        const port = location.port || '3876';
        const base = `http://${host}:${port}`;
        const familyId = window.LOCKED_FAMILY_ID || 'default_family';
        const pkgType = window.PACKAGE_TYPE || 'full';

        document.getElementById('link-parent').href = `${base}/family/${familyId}/parent`;
        document.getElementById('link-child').href = `${base}/family/${familyId}/child`;
        document.getElementById('link-mobile').href = `${base}/mobile/${familyId}`;
        document.getElementById('link-motong').href = `${base}/motong/${familyId}`;
        document.getElementById('link-master').href = `${base}/master/${familyId}`;
        document.getElementById('current-url').textContent = base;

        // 根据安装包类型隐藏不该出现的入口
        const visibility = {
            full: ['parent','child','mobile','motong','master'],
            parent: ['parent','motong','master'],
            child: ['child'],
            mobile: ['mobile']
        };
        const allowed = visibility[pkgType] || visibility.full;
        const map = {
            'parent': 'link-parent',
            'child': 'link-child',
            'mobile': 'link-mobile',
            'motong': 'link-motong',
            'master': 'link-master'
        };
        for (const [key, id] of Object.entries(map)) {
            const el = document.getElementById(id);
            if (el && !allowed.includes(key)) {
                el.style.display = 'none';
            }
        }
    </script>
</body>
</html>
